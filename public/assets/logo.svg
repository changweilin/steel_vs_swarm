<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140">
  <defs>
    <!-- Gradients for premium tech feel -->
    <linearGradient id="blue-steel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#005b9f" />
    </linearGradient>
    <linearGradient id="swarm-yellow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea00" />
      <stop offset="100%" stop-color="#ff6f00" />
    </linearGradient>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background tech crosshair elements -->
  <path d="M 20 70 H 220 M 120 15 V 125" stroke="#1c2630" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="120" cy="70" r="50" fill="none" stroke="#1c2630" stroke-width="1" stroke-dasharray="3 6" />

  <!-- Left: Steel (Blue) Mech Triangle -->
  <g filter="url(#glow-blue)">
    <polygon points="60,25 116,70 60,115" fill="url(#blue-steel-grad)" opacity="0.95" />
    <polygon points="46,35 46,105 53,70" fill="#00e5ff" opacity="0.75" />
  </g>
  
  <!-- Center separator line (glowing) -->
  <line x1="120" y1="20" x2="120" y2="120" stroke="#2a3540" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Right: Swarm (Yellow) Drone Wing 1 -->
  <g filter="url(#glow-yellow)">
    <polygon points="128,25 186,49 144,70 128,70" fill="url(#swarm-yellow-grad)" opacity="0.95" />
    <!-- Wing 2 -->
    <polygon points="128,80 162,94 128,115 120,115" fill="url(#swarm-yellow-grad)" opacity="0.85" />
    <!-- Swarm Core Dot -->
    <circle cx="176" cy="83" r="7" fill="#ffea00" />
  </g>
</svg>
