function renderIcon(id, p = 0.35, remS = 2.4, stacks = null, positive = false) {
  const d = DEFS[id];
  if (!d) return '';
  const circ = 76.65;
  const dashOffset = (circ * (1 - p)).toFixed(2);
  const deg = (p * 360).toFixed(1);
  const rad = p * Math.PI * 2;
  const tipX = (14 + 12.2 * Math.sin(rad)).toFixed(2);
  const tipY = (14 - 12.2 * Math.cos(rad)).toFixed(2);
  const showTip = p > 0.02 && p < 0.98;
  const polarityClass = positive ? 'pos' : 'neg';
  const polarityChar = positive ? '↑' : '↓';
  const stackBadge = (stacks != null && stacks > 1) ? `<span class="si-n">${stacks}</span>` : '';

  return `<div class="si" style="--si-bg:${d.bg};--si-fg:${d.fg}" title="${d.label} (${remS}s)">`
    + `<div class="si-clock-wipe" style="background: conic-gradient(rgba(0,0,0,0.52) ${deg}deg, transparent 0deg);"></div>`
    + `<svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">`
    + `<g class="si-icon">${d.svg}</g>`
    + `<circle class="si-clk-bg" cx="14" cy="14" r="12.2" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>`
    + `<line x1="14" y1="1.8" x2="14" y2="3.8" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>`
    + `<circle class="si-clk-arc" cx="14" cy="14" r="12.2" fill="none" stroke="${d.fg}" stroke-width="2.3"`
    + ` stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}" stroke-linecap="round" transform="rotate(-90 14 14)"/>`
    + (showTip ? `<circle cx="${tipX}" cy="${tipY}" r="1.4" fill="#ffffff"/>` : '')
    + `</svg>`
    + `<span class="si-t">${remS}</span>`
    + `<span class="si-p ${polarityClass}">${polarityChar}</span>`
    + stackBadge
    + `</div>`;
}

document.getElementById('clockDemo').innerHTML = demoStages.map(s => `
  <div class="cell">
    ${renderIcon('paralyze', s.p, s.remS, null, false)}
    <span class="cell-name">${s.label}</span>
    <span class="cell-sub">${(s.p * 360).toFixed(0)}° 順時針</span>
  </div>
`).join('');

// 2. Negative grid
const negIds = ['stun', 'paralyze', 'emp', 'freeze', 'slow', 'burn', 'bleed', 'poison', 'blind', 'conf', 'mark', 'unbal', 'hiSup'];
document.getElementById('negativeGrid').innerHTML = negIds.map(id => {
  const d = DEFS[id];
  return `
    <div class="cell">
      ${renderIcon(id, 0.4, '2.4', null, false)}
      <span class="cell-name">${d.label} (${id})</span>
      <span class="cell-sub">${d.sub}</span>
    </div>
  `;
}).join('');

// 3. Positive grid
const posIds = ['stealth', 'inv', 'mod', 'tempered', 'hardened', 'vampiric', 'bounty'];
document.getElementById('positiveGrid').innerHTML = posIds.map(id => {
  const d = DEFS[id];
  const stacks = id === 'mod' ? 3 : null;
  return `
    <div class="cell">
      ${renderIcon(id, 0.35, '3.2', stacks, true)}
      <span class="cell-name">${d.label} (${id})</span>
      <span class="cell-sub">${d.sub}</span>
    </div>
  `;
}).join('');
</script>
</body></html>
