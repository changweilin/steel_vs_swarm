<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人形鍛造台(dev)— 人形特徵 → 機器人零件</title>
<!-- three 走 CDN importmap,與 public/index.html 同一版(A2:不進 package.json) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #12141a; color: #dfe5ee;
         font: 14px/1.5 "Noto Sans TC", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
           background: #1a1e27; border-bottom: 1px solid #2a3040; flex-wrap: wrap; }
  header b { font-size: 15px; }
  header .dim { color: #7a8496; font-size: 12px; }
  .seg { display: inline-flex; gap: 4px; background: #12141a; border: 1px solid #2a3040;
         border-radius: 8px; padding: 3px; }
  .segb { border: 0; background: transparent; color: #aab3c2; padding: 5px 12px;
          border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .segb.on { background: #2d3646; color: #fff; }
  .main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; width: 100%; height: 100%; display: block; min-width: 0; }
  aside { width: 340px; overflow: auto; padding: 12px 14px; background: #171a21;
          border-left: 1px solid #2a3040; }
  aside h3 { font-size: 16px; margin-bottom: 6px; }
  aside h3 small { color: #7a8496; font-weight: normal; }
  aside h4 { font-size: 13px; color: #9fb4d8; margin: 12px 0 4px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside th, aside td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #232936; }
  aside th { color: #7a8496; font-weight: normal; }
  aside tr.ovr td { color: #ffd479; }
  .ovr-k { color: #ffd479; }
  ul.chan { list-style: none; font-size: 12.5px; }
  ul.chan li.ok { color: #8fd8a0; }
  ul.chan li.bad { color: #ff8a80; }
  .proto-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .proto-strip .dim { color: #7a8496; font-size: 12px; }
  figure.proto { margin: 0; width: calc(50% - 4px); }
  figure.proto img { width: 100%; display: block; border: 1px solid #2a3040; border-radius: 6px; }
  figure.proto figcaption { color: #9fb4d8; font-size: 11px; text-align: center; padding-top: 2px; }
</style>
</head>
<body>
<header>
  <b>人形鍛造台</b>
  <span class="dim">dev-only ・ 人形特徵(VRM 標準)→ 機器人零件 ・ locomotion.js 真品驅動</span>
  <div class="seg" id="specSeg"></div>
  <div class="seg">
    <button class="segb" id="spdIdle">靜止</button>
    <button class="segb" id="spdWalk">行走</button>
    <button class="segb" id="spdRun">奔跑</button>
  </div>
  <div class="seg">
    <button class="segb" id="btnFire">輕武器連射</button>
    <button class="segb" id="btnHeavy">重武器蓄力</button>
    <button class="segb" id="btnCastO">全向招式</button>
    <button class="segb" id="btnCastD">定向招式</button>
  </div>
  <div class="seg">
    <button class="segb" id="btnSpin">環繞檢視</button>
    <button class="segb" id="btnJoints">特徵樞軸</button>
  </div>
</header>
<div class="main">
  <canvas id="stage"></canvas>
  <aside id="panel"></aside>
</div>
<script type="module" src="/tools/humanoid_forge/viewer.js"></script>
</body>
</html>
