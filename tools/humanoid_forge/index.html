<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機體展示台(dev)— 依原型分頁的全機型鍛造台</title>
<!-- three 走 CDN importmap,與 public/index.html 同一版(A2:不進 package.json) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #12141a; color: #dfe5ee;
         font: 14px/1.5 "Noto Sans TC", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 7px 12px;
           background: #1a1e27; border-bottom: 1px solid #2a3040; flex-wrap: wrap; }
  header b { font-size: 15px; }
  header .dim { color: #7a8496; font-size: 12px; }
  .seg { display: inline-flex; gap: 4px; background: #12141a; border: 1px solid #2a3040;
         border-radius: 8px; padding: 3px; flex-wrap: wrap; }
  .segb { border: 0; background: transparent; color: #aab3c2; padding: 5px 11px;
          border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .segb.on { background: #2d3646; color: #fff; }
  .segb.cat-on { background: #3a4a63; color: #fff; }
  .segb .fm { color: #7fd8ff; font-size: 11px; }
  .segb.missing { color: #5d6472; font-style: italic; cursor: not-allowed; }
  .main { flex: 1; display: flex; min-height: 0; }
  .stagewrap { flex: 1; min-width: 0; position: relative; }
  #stage { width: 100%; height: 100%; display: block; }
  #stageTag { position: absolute; left: 12px; top: 10px; font-size: 12px; color: #9fb4d8;
              background: rgba(18,20,26,.72); border: 1px solid #2a3040; border-radius: 6px;
              padding: 3px 9px; pointer-events: none; }
  aside { width: 350px; overflow: auto; padding: 12px 14px; background: #171a21;
          border-left: 1px solid #2a3040; }
  aside h3 { font-size: 16px; margin-bottom: 4px; }
  aside h3 small { color: #7a8496; font-weight: normal; }
  aside h4 { font-size: 13px; color: #9fb4d8; margin: 12px 0 4px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside th, aside td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #232936; }
  aside th { color: #7a8496; font-weight: normal; }
  aside tr.ovr td { color: #ffd479; }
  .ovr-k { color: #ffd479; }
  ul.chan { list-style: none; font-size: 12.5px; }
  ul.chan li.ok { color: #8fd8a0; }
  ul.chan li.bad { color: #ff8a80; }
  .proto-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .proto-strip .dim { color: #7a8496; font-size: 12px; }
  figure.proto { margin: 0; width: calc(50% - 4px); }
  figure.proto img { width: 100%; display: block; border: 1px solid #2a3040; border-radius: 6px; }
  figure.proto figcaption { color: #9fb4d8; font-size: 11px; text-align: center; padding-top: 2px; }
  .ref-src { color: #cfd6e2; font-size: 12px; margin: 2px 0 4px; }
  .ref-src b { color: #ffd479; font-weight: 600; }
  .ref-src span { color: #7a8496; }
  .jump { display: inline-block; margin: 4px 6px 0 0; padding: 3px 9px; font-size: 12px;
          border: 1px solid #3a4a63; border-radius: 6px; color: #9fd8ff; background: #1b2129;
          cursor: pointer; }
  .jump:hover { background: #232c38; }
  .note { color: #7a8496; font-size: 11.5px; margin-top: 4px; }
  /* ---- 紙娃娃編輯面板 ---- */
  #dollPanel h4 { margin: 0 0 6px; font-size: 14px; color: #dfe5ee; }
  #dollPanel h4 small { color: #7a8496; font-weight: normal; }
  .d-note { color: #8f9bb0; font-size: 11.5px; margin: 6px 0; line-height: 1.45; }
  .d-dim { color: #6c7480; font-size: 11.5px; }
  .d-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; font-size: 12.5px; }
  .d-row > span { width: 46px; color: #9fb4d8; flex: none; }
  .d-row input[type=range] { flex: 1; min-width: 0; }
  .d-row input[type=text], .d-row select { flex: 1; min-width: 0; background: #12141a; color: #dfe5ee;
    border: 1px solid #2a3040; border-radius: 5px; padding: 3px 6px; font: inherit; font-size: 12.5px; }
  .d-row input[type=color] { width: 42px; height: 24px; background: none; border: 1px solid #2a3040; }
  .d-row i { width: 68px; text-align: right; color: #cfd6e2; font-style: normal; font-size: 11.5px; }
  .d-sel { font-size: 12px; color: #ffd479; margin: 6px 0; word-break: break-all; }
  .d-btns { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0; }
  .d-btns .segb, .segb.sm { border: 1px solid #2a3040; background: #1b2129; }
  .d-list { display: flex; flex-wrap: wrap; gap: 4px; margin: 7px 0; }
  .d-chip { font-size: 11.5px; padding: 2px 7px; border: 1px solid #3a4a63; border-radius: 5px;
    color: #9fd8ff; background: #1b2129; cursor: pointer; }
  .d-chip.on { background: #2d3646; color: #fff; }
  .d-foot { display: flex; gap: 5px; margin-top: 10px; border-top: 1px solid #232936; padding-top: 8px; }
  .d-stat { font-size: 11.5px; color: #8fd8a0; margin: 6px 0; }
  .d-stat b { color: #ffd479; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <b>機體展示台</b>
  <span class="dim">dev-only ・ 依原型分三頁 ・ locomotion.js 真品驅動</span>
  <div class="seg" id="catSeg"></div>
  <div class="seg" id="viewSeg">
    <button class="segb on" id="vMech">機體</button>
    <button class="segb" id="vWpnL">武器・輕</button>
    <button class="segb" id="vWpnH">武器・重</button>
  </div>
  <div class="seg">
    <button class="segb" id="spdIdle">靜止</button>
    <button class="segb" id="spdWalk">巡航</button>
    <button class="segb" id="spdRun">全速</button>
  </div>
  <div class="seg">
    <button class="segb" id="btnFire">輕武器連射</button>
    <button class="segb" id="btnHeavy">重武器蓄力</button>
    <button class="segb" id="btnCastO">全向招式</button>
    <button class="segb" id="btnCastD">定向招式</button>
  </div>
  <div class="seg">
    <button class="segb" id="btnSpin">環繞檢視</button>
    <button class="segb" id="btnJoints">特徵樞軸</button>
  </div>
  <div class="seg">
    <button class="segb" id="btnEdit">🧷 紙娃娃編輯</button>
  </div>
</header>
<div class="seg" id="specSeg" style="margin:6px 12px 0;"></div>
<div class="main">
  <div class="stagewrap"><canvas id="stage"></canvas><div id="stageTag"></div></div>
  <aside id="panel"></aside>
  <aside id="dollPanel" hidden></aside>
</div>
<script type="module" src="/tools/humanoid_forge/viewer.js"></script>
</body>
</html>
