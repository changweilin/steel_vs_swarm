<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機體美術覆核台(dev)</title>
<!-- 資產根 MUST 鏡射遊戲的 URL 佈局(A28):`models.js` 的 `MODEL_MANIFEST` 取的是**相對**
     網址(`assets/models/quaternius/*.glb`),遊戲那邊 public/ 就是根。少了這一行,3D 展示台
     的 GLB 全數 404 ⇒ 每一台都靜靜退回程序生成的 fallback(那正是 models.js 的設計),
     畫面上看起來完全正常,只有 console 有警告。2026-08-05 由 3D 零件對照台的同一個坑找出來。 -->
<base href="/public/">
<!-- three 走 CDN importmap,與 public/index.html 同一版(A2:不進 package.json) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="/public/css/style.css">
<link rel="stylesheet" href="/tools/codex_review/review.css">
<!-- 與機體展示台 :8631 共用的兩塊(原型參考照帶 + 紙娃娃面板):標記由 refstrip.js /
     dolledit.js 產生,樣式 MUST 也是同一份(見 board.css 檔頭)。 -->
<link rel="stylesheet" href="/tools/humanoid_forge/board.css">
</head>
<body class="cr">
<header class="cr-top">
  <b>機體美術覆核台</b>
  <span class="cr-dim">dev-only ・ 不進遊戲建置</span>
  <span class="cr-stat" id="crStat">載入中…</span>
  <span class="cr-grow"></span>
  <div class="seg cr-filter" id="crFilter">
    <button class="segb on" data-f="all">全部</button>
    <button class="segb" data-f="todo">待覆核</button>
    <button class="segb" data-f="flag">有意見</button>
    <button class="segb" data-f="ai">AI 稿</button>
    <button class="segb" data-f="miss">缺圖</button>
  </div>
</header>
<div class="cr-main">
  <nav class="cr-list" id="crList"></nav>
  <section class="cr-body" id="crBody"></section>
</div>
<div class="cr-modal" id="crModal" hidden></div>
<script type="module" src="/tools/codex_review/review.js"></script>
</body>
</html>
