# ============ 1v1 兵線立體場景掃描(手動觸發;需要外網)============
# `tools/audit_lane_scenarios.mjs` 要抓 Overpass 路網 + AWS terrarium 高程 —— 開發沙箱常沒有
# 這兩個出口,故另開一支手動 workflow 在有外網的 runner 上跑,結果印在 job log 與 artifact。
# 回歸驗證(ci.yml)刻意不含這支:外部服務會限流,不該讓 PR 卡在別人的伺服器上。
name: 兵線場景掃描

on:
  # 暫時的推送觸發(第二輪:純陸域高架橋 / 一般道路高地 / 平地隧道診斷)——
  # 沙箱沒有圖資出口,靠 runner 取結果;定案後 MUST 再移除。
  push:
    branches: [claude/1v1-map-scenarios-test-obzl6w]
  workflow_dispatch:
    inputs:
      only:
        description: '只掃指定場地(逗號分隔;留空 = 全部)'
        required: false
        default: ''
      bake:
        description: '掃描前先重烤這些場地的兵線(逗號分隔;留空 = 不重烤)'
        required: false
        default: ''

# 同時只跑一份掃描:新的觸發取代還在跑的舊掃描(Overpass 很慢,不要並排燒 runner)
concurrency:
  group: lane-scenarios
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Overpass/terrarium 的回應快取:跨 run 續跑用。公共 Overpass 節點排隊時單場地要等上
      # 一分鐘,一次 job 掃不完 22 個場地 —— 有快取就能「每跑一次補上幾個場地」直到掃完。
      - uses: actions/cache@v4
        with:
          path: tools/.scen_cache
          key: scen-cache-${{ github.run_id }}
          restore-keys: scen-cache-

      - name: 重烤指定場地兵線
        if: ${{ inputs.bake != '' }}
        run: ONLY='${{ inputs.bake }}' node tools/bake_venue_lanes.mjs

      # 新場地的兵線烘焙(推送觸發時固定烤這些;定案後連同推送觸發一起移除)
      - name: 烤新測試場地兵線
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        run: ONLY=parkave node tools/bake_venue_lanes.mjs

      - name: 兵線場景掃描
        continue-on-error: true
        run: node tools/audit_lane_scenarios.mjs ${{ inputs.only != '' && format('--only={0}', inputs.only) || '' }} --max-min=14 --json=scen.json

      - name: 掃描結果 JSON
        if: always()
        run: test -f scen.json && node -e "const d=require('./scen.json');for(const r of d.results)console.log(r.id, JSON.stringify(r.hits), r.hits2Water?('water='+JSON.stringify(r.hits2Water)):'', r.flatTunnel?('flat='+JSON.stringify(r.flatTunnel)):'', r.landBridgeCand?('landbr='+JSON.stringify(r.landBridgeCand)):'', r.tunnelCand?('tuncand='+JSON.stringify(r.tunnelCand)):'', r.osm?JSON.stringify(r.osm):r.error||'')" || echo '(無 scen.json)'

      # ① 的新場地探測:找「短、覆蓋薄」的成洞隧道(地下道感)
      - name: 隧道候選探測
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        run: |
          node tools/audit_lane_scenarios.mjs --probe='40.7800,-73.9690,紐約中央公園79街橫貫道;40.7715,-73.9735,紐約中央公園65街橫貫道;35.0092,135.7898,京都蹴上;25.0925,121.5455,台北自強隧道;48.8600,2.2930,巴黎河岸下穿;25.0470,121.5180,台北市民大道;35.6640,139.7300,東京六本木;41.3900,2.1550,巴塞隆納'

      - name: 新場地兵線 diff(複製回儲存庫用)
        if: ${{ github.event_name == 'push' }}
        run: git --no-pager diff -- public/js/venueLanes.js | head -60

      - name: 兵線重烤結果(diff)
        if: ${{ inputs.bake != '' }}
        run: git --no-pager diff --stat && git --no-pager diff public/js/venueLanes.js | head -400

      - uses: actions/upload-artifact@v4
        with:
          name: lane-scenarios
          path: |
            scen.json
            public/js/venueLanes.js
          if-no-files-found: warn
