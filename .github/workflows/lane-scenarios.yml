# ============ 1v1 兵線立體場景掃描(手動觸發;需要外網)============
# `tools/audit_lane_scenarios.mjs` 要抓 Overpass 路網 + AWS terrarium 高程 —— 開發沙箱常沒有
# 這兩個出口,故另開一支手動 workflow 在有外網的 runner 上跑,結果印在 job log 與 artifact。
# 回歸驗證(ci.yml)刻意不含這支:外部服務會限流,不該讓 PR 卡在別人的伺服器上。
name: 兵線場景掃描

on:
  # 暫時的推送觸發:烤新測試場地(civicblvd)並複驗,定案後 MUST 移除。
  push:
    branches: [claude/1v1-map-scenarios-test-obzl6w]
  workflow_dispatch:
    inputs:
      only:
        description: '只掃指定場地(逗號分隔;留空 = 全部)'
        required: false
        default: ''
      bake:
        description: '掃描前先重烤這些場地的兵線(逗號分隔;留空 = 不重烤)'
        required: false
        default: ''
      probe:
        description: '隧道候選探測點(lat,lng,名稱;以分號分隔;留空 = 不探測)'
        required: false
        default: ''

# 同時只跑一份掃描:新的觸發取代還在跑的舊掃描(Overpass 很慢,不要並排燒 runner)
concurrency:
  group: lane-scenarios
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Overpass/terrarium 的回應快取:跨 run 續跑用。公共 Overpass 節點排隊時單場地要等上
      # 一分鐘,一次 job 掃不完 22 個場地 —— 有快取就能「每跑一次補上幾個場地」直到掃完。
      - uses: actions/cache@v4
        with:
          path: tools/.scen_cache
          key: scen-cache-${{ github.run_id }}
          restore-keys: scen-cache-

      - name: 重烤指定場地兵線
        if: ${{ inputs.bake != '' }}
        run: ONLY='${{ inputs.bake }}' node tools/bake_venue_lanes.mjs

      - name: 兵線場景掃描
        continue-on-error: true
        run: node tools/audit_lane_scenarios.mjs ${{ inputs.only != '' && format('--only={0}', inputs.only) || '' }} --max-min=14 --json=scen.json

      - name: 掃描結果 JSON
        if: always()
        run: test -f scen.json && node -e "const d=require('./scen.json');for(const r of d.results){const bits=[Object.keys(r.hits).length?JSON.stringify(r.hits):'',r.flatTunnel?'②地下道候選='+JSON.stringify(r.flatTunnel):'',r.hits2Water?'跨水橋='+JSON.stringify(r.hits2Water):''].filter(Boolean);if(bits.length)console.log(r.id,bits.join(' '))}" || echo '(無 scen.json)'

      # ① 的新場地探測:找「短、覆蓋薄」的成洞隧道。手動觸發時用 probe 輸入自訂點位。
      - name: 隧道候選探測
        if: ${{ inputs.probe != '' }}
        continue-on-error: true
        run: node tools/audit_lane_scenarios.mjs --probe='${{ inputs.probe }}'

      - name: 新場地兵線 diff(複製回儲存庫用)
        if: ${{ github.event_name == 'push' }}
        run: git --no-pager diff -- public/js/venueLanes.js | head -40

      - name: 兵線重烤結果(diff)
        if: ${{ inputs.bake != '' }}
        run: git --no-pager diff --stat && git --no-pager diff public/js/venueLanes.js | head -400

      - uses: actions/upload-artifact@v4
        with:
          name: lane-scenarios
          path: |
            scen.json
            public/js/venueLanes.js
          if-no-files-found: warn
