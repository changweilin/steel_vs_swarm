# ============ Regression (offline audits + balance invariants + e2e) ============
# Change-to-guard mapping lives in `.claude/rules/verification.md`; commands live in `package.json`.
# 需要 Playwright 的版型/陀螺儀/觸控量測不在這裡跑(那些腳本找不到 playwright 時會自己跳過)。
name: 回歸驗證

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Single websocket dependency only (see root `AGENTS.md` §2).
      - run: npm ci

      - name: 三種連線機制稽核
        run: node tools/audit_net_modes.mjs

      # 客戶端模組半數要 CDN 的 three ⇒ 沒有任何離線稽核 import 得了它們:語法錯誤會讓底下
      # 整批稽核 + bal + e2e 一起全綠,而真人一開頁面就是白畫面(見該腳本檔頭)。排最前面。
      - name: 客戶端模組語法閘
        run: node tools/audit_client_syntax.mjs

      - name: 完整離線稽核矩陣
        run: node tools/audit_suite.mjs

      - name: 平衡不變式
        run: npm run bal

      # `npm test` is a WS client only and does not boot the server (see `package.json`).
      - name: 端對端(先起伺服器再測)
        timeout-minutes: 3
        run: |
          node server/server.js --port 8620 &
          for i in $(seq 1 40); do curl -sf http://localhost:8620/healthz >/dev/null && break; sleep 0.25; done
          npm test

      - name: 單機特化版打包冒煙
        run: node tools/build_solo.mjs dist
