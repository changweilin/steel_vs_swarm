# ============ 回歸驗證(離線稽核 + 平衡不變式 + 端對端)============
# 對應 /CLAUDE.md §5「改了什麼 → MUST 跑什麼」裡**不需要瀏覽器**的那幾條。
# 需要 Playwright 的版型/陀螺儀/觸控量測不在這裡跑(那些腳本找不到 playwright 時會自己跳過)。
name: 回歸驗證

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # 唯一的 npm 依賴是 ws(見 /CLAUDE.md A2:MUST NOT 新增任何 npm 依賴)
      - run: npm ci

      - name: 三種連線機制稽核
        run: node tools/audit_net_modes.mjs

      # 客戶端模組半數要 CDN 的 three ⇒ 沒有任何離線稽核 import 得了它們:語法錯誤會讓底下
      # 整批稽核 + bal + e2e 一起全綠,而真人一開頁面就是白畫面(見該腳本檔頭)。排最前面。
      - name: 客戶端模組語法閘
        run: node tools/audit_client_syntax.mjs

      - name: 完整離線稽核矩陣
        run: node tools/audit_suite.mjs

      - name: 平衡不變式
        run: npm run bal

      # `npm test` 只是 WS client,**不會自己啟動伺服器**(見 /CLAUDE.md §5 測試標準流程)
      - name: 端對端(先起伺服器再測)
        timeout-minutes: 3
        run: |
          node server/server.js --port 8620 &
          for i in $(seq 1 40); do curl -sf http://localhost:8620/healthz >/dev/null && break; sleep 0.25; done
          npm test

      - name: 單機特化版打包冒煙
        run: node tools/build_solo.mjs dist
