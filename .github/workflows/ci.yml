# ============ 回歸驗證(離線稽核 + 平衡不變式 + 端對端)============
# 對應 /CLAUDE.md §5「改了什麼 → MUST 跑什麼」裡**不需要瀏覽器**的那幾條。
# 需要 Playwright 的版型/陀螺儀/觸控量測不在這裡跑(那些腳本找不到 playwright 時會自己跳過)。
name: 回歸驗證

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # 唯一的 npm 依賴是 ws(見 /CLAUDE.md A2:MUST NOT 新增任何 npm 依賴)
      - run: npm ci

      - name: 三種連線機制稽核
        run: node tools/audit_net_modes.mjs

      - name: 離線稽核
        run: |
          node tools/audit_map_rules.mjs
          node tools/audit_lane_sep.mjs
          node tools/audit_lane_navigation.mjs
          node tools/audit_terrain_ray.mjs
          node tools/audit_layer_block.mjs
          node tools/audit_gpu_lifecycle.mjs
          node tools/audit_minimap_view.mjs
          node tools/audit_object_joints.mjs
          node tools/audit_lance_hit.mjs
          node tools/audit_weapon_gate.mjs
          node tools/audit_aoe_trim.mjs
          node tools/audit_fire_rate.mjs
          node tools/audit_recoil_move.mjs
          node tools/audit_open_tunnel.mjs
          node tools/audit_underpass.mjs
          node tools/audit_climb.mjs
          node tools/audit_cc_flash.mjs
          node tools/audit_flight_power.mjs
          node tools/audit_slope_move.mjs
          node tools/audit_road_joint.mjs
          node tools/audit_road_bed.mjs
          node tools/audit_view_lock.mjs
          node tools/audit_ctrl_mode.mjs
          node tools/audit_spectator_cam.mjs
          node tools/audit_shop_auto.mjs
          node tools/audit_bot_vision.mjs
          node tools/audit_escort_form.mjs
          node tools/audit_cel_pipeline.mjs
          node tools/audit_visual_prefs.mjs
          node tools/audit_world_text.mjs
          node tools/audit_beacons.mjs
          node tools/audit_vernacular.mjs

      - name: 平衡七不變式
        run: npm run bal

      # `npm test` 只是 WS client,**不會自己啟動伺服器**(見 /CLAUDE.md §5 測試標準流程)
      - name: 端對端(先起伺服器再測)
        run: |
          node server/server.js --port 8620 &
          for i in $(seq 1 40); do curl -sf http://localhost:8620/healthz >/dev/null && break; sleep 0.25; done
          npm test

      - name: 單機特化版打包冒煙
        run: node tools/build_solo.mjs dist
