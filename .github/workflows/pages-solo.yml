# ============ 單機特化版 → GitHub Pages ============
# 三種遊戲機制中的「個人單機版本」產線:GitHub Actions 把儲存庫複製成靜態站台
# (`tools/build_solo.mjs`,純檔案複製,無 bundler、無轉譯 —— 見 /CLAUDE.md §1「無 build step」),
# 部署後任何人開網址就能玩:權威模擬 `server/sim.js` 直接跑在瀏覽器裡,不需要任何伺服器。
#
# 首次啟用:儲存庫 Settings → Pages → Source 選「GitHub Actions」。
name: 單機版部署 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時只跑一份部署;新的推送取代排隊中的舊部署(但不中斷進行中的那次)
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 唯一的 npm 依賴是 ws(伺服器用),靜態單機版根本不需要 —— 故不裝任何東西
      - name: 三種連線機制稽核
        run: node tools/audit_net_modes.mjs
      - name: 打包單機特化版
        run: node tools/build_solo.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
